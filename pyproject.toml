[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nord-books-scraper"
version = "0.1.0"
description = "Asynchronous books.toscrape.com scraper"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "grpcio>=1.70,<2",
    "httpx>=0.27,<1",
    "protobuf>=6,<7",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.70,<2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
nord-books-scraper = "books_scraper.main:run"
nord-books-parser = "books_scraper.parser_main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [
    "src/books_scraper/proto/product_parser_pb2.py",
    "src/books_scraper/proto/product_parser_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
